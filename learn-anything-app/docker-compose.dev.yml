# Local-only development example; container behavior is unverified.
# Requires a dedicated disposable/local database; no managed service admission.
services:
  app:
    build:
      context: .
      target: builder  # Use builder stage for dev (has all deps)
    ports: ["127.0.0.1:8000:8000"]
    environment:
      - LA_DATABASE_URL=${LA_DATABASE_URL}  # Set in .env or shell
      - LA_STATE_BACKEND=postgres
      - LA_LOG_LEVEL=DEBUG
    volumes:
      - .:/app:rw          # Mount source for hot-reload
      - app_data:/app/data
    command: ["uvicorn", "app.main:app", "--reload", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
volumes:
  app_data:
